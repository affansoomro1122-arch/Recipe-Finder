    <title>Recipe Finder</title>
    <!-- link for css -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="container bg-dark">
        <h1 id="mainTopFinder">Beti Kamla! Aj Kahny Main Kiya Banwo Gi</h1>

                </div>
            </div>
        </div>
    </div>



    <script src="/assets/js/script.js"></script>
